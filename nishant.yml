apiVersion: v1
kind: Namespace
metadata:
  name: nishant-space
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: java-app
  namespace: nishant-space
spec:
  selector:
    matchLabels:
      app: app
  template:
    metadata:
      labels:
        app: app
    spec:
      containers:
        - name: java-app
          image: gauravchaudhari7165/new_img
